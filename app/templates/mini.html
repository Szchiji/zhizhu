<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>核验</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg:#07111f; --card:rgba(18,32,54,.92); --line:rgba(255,255,255,.08); --text:#f4f7fb; --muted:#8ea0b5; --blue:#3b82f6; --green:#12b981; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(1200px 500px at 10% -10%, #16345c 0%, transparent 55%), var(--bg); }
    .wrap { padding:18px 16px 96px; }
    .user { display:flex; gap:12px; align-items:center; margin-bottom:16px; }
    .av { width:44px; height:44px; border-radius:14px; background:#1e3a5f; display:flex; align-items:center; justify-content:center; font-weight:700; overflow:hidden; }
    .av img { width:44px; height:44px; object-fit:cover; }
    .hello { font-size:13px; color:var(--muted); }
    .name { font-size:18px; font-weight:700; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; }
    h1 { font-size:20px; margin:0 0 6px; }
    .sub { color:var(--muted); font-size:13px; line-height:1.6; }
    .price { font-size:28px; font-weight:800; margin:14px 0 4px; }
    .unit { font-size:14px; color:var(--muted); font-weight:500; }
    .btns { display:flex; gap:8px; margin-top:14px; }
    button { flex:1; border:0; border-radius:14px; padding:12px 10px; font-size:14px; font-weight:700; color:#fff; background:var(--blue); }
    .usdt { background:var(--green); }
    .ghost { background:#1e3a5f; }
    button:disabled { opacity:.45; }
    input, textarea { width:100%; border:1px solid var(--line); background:#0b1728; color:var(--text); border-radius:12px; padding:12px; font-size:15px; margin:8px 0 0; }
    textarea { min-height:80px; }
    label { display:block; margin-top:12px; color:var(--muted); font-size:12px; }
    .err,.ok { display:none; border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
    .err { background:#3f1d2a; color:#fecdd3; }
    .ok { background:#113327; color:#bbf7d0; }
    .mono { word-break:break-all; font-family:ui-monospace,monospace; background:#0b1728; padding:10px; border-radius:10px; }
    .nav { position:fixed; left:12px; right:12px; bottom:12px; display:flex; gap:6px; background:#0c1a2e; border:1px solid var(--line); border-radius:18px; padding:6px; }
    .nav button { background:transparent; color:var(--muted); font-size:13px; padding:10px 6px; }
    .nav button.on { background:#163154; color:#fff; }
    .hidden { display:none; }
    .pill { display:inline-block; font-size:12px; padding:4px 8px; border-radius:999px; background:#163154; color:#cfe3ff; }
    .row { display:flex; justify-content:space-between; gap:8px; margin:8px 0; font-size:14px; }
    .idcard { white-space:pre-wrap; line-height:1.7; }
    .olist { font-size:13px; color:var(--muted); }
    .olist div { padding:8px 0; border-bottom:1px solid var(--line); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="user">
      <div class="av" id="av">?</div>
      <div><div class="hello">电报账号登录</div><div class="name" id="uname">加载中…</div></div>
    </div>
    <div id="err" class="err"></div><div id="ok" class="ok"></div>
    <section id="tab-pay">
      <div class="card">
        <div class="pill">年付套餐</div>
        <h1>官方身份核验</h1>
        <p class="sub">开通 365 天。请复制地址原额转账。</p>
        <div class="price">{{ stars }}⭐ <span class="unit">或 {{ usdt }} USDT</span></div>
        <div class="btns">
          <button onclick="pay(this,'stars')">Stars 支付</button>
          <button class="usdt" onclick="pay(this,'usdt')">USDT 支付</button>
        </div>
      </div>
      <div id="checkout" class="card hidden">
        <h1>转账支付</h1>
        <p class="sub">复制地址后原额转账，20 分钟内到账自动开通。</p>
        <div class="row"><span>订单</span><b id="oid"></b></div>
        <div class="row"><span>金额</span><b id="oamt"></b></div>
        <div class="row"><span>网络</span><b id="ochain"></b></div>
        <div class="mono" id="oaddr"></div>
        <div class="btns">
          <button class="ghost" onclick="copyAddr()">复制地址</button>
          <button class="ghost" onclick="cancelPay()">取消订单</button>
        </div>
      </div>
    </section>
    <section id="tab-q" class="hidden">
      <div class="card">
        <h1>查询登记</h1>
        <input id="q" placeholder="@username" />
        <div class="btns"><button onclick="lookup()">查询</button></div>
      </div>
      <div id="qcard" class="card hidden"><div class="pill">✅ 官方登记</div><div class="idcard" id="qtext"></div></div>
    </section>
    <section id="tab-me" class="hidden">
      <div class="card">
        <h1>我的账户</h1>
        <p class="sub" id="status">—</p>
        <div class="row"><span class="sub">套餐</span><b id="plan">—</b></div>
        <div class="row"><span class="sub">到期</span><b id="until">—</b></div>
      </div>
      <div class="card">
        <h1>登记资料</h1>
        <label>对外姓名</label><input id="display" />
        <label>身份卡正文</label><textarea id="card"></textarea>
        <div class="btns"><button onclick="save()">保存</button></div>
        <p class="sub" id="needpay"></p>
      </div>
      <div class="card">
        <h1>订单记录</h1>
        <div class="olist" id="olist">暂无</div>
      </div>
    </section>
    <section id="tab-adm" class="hidden">
      <div class="card">
        <h1>管理</h1>
        <p class="sub" id="aboard"></p>
        <label>Stars 年付</label><input id="astars" type="number" />
        <label>USDT 年付</label><input id="ausdt" type="number" />
        <div class="btns">
          <button onclick="setPrice('stars')">改 Stars</button>
          <button class="usdt" onclick="setPrice('usdt')">改 USDT</button>
        </div>
        <label>收款地址</label><input id="aaddr" />
        <div class="btns"><button class="ghost" onclick="setAddr()">保存地址</button><button class="ghost" onclick="toggleClone()" id="aclone">克隆</button></div>
      </div>
      <div class="card">
        <h1>强制订阅</h1>
        <p class="sub">填 @频道名 或 -100 频道ID。机器人需是频道管理员。</p>
        <label>频道</label><input id="achannel" placeholder="@channel 或 -100xxxxxxxxxx" />
        <div class="btns"><button class="ghost" onclick="saveChannel()">保存频道</button><button class="ghost" id="achon" onclick="toggleChannel()">强制订阅：关</button></div>
      </div>
      <div class="card">
        <h1>用户管理</h1>
        <input id="uq" placeholder="@用户名 或 电报ID" />
        <div class="btns"><button onclick="searchUsers()">搜索</button></div>
        <div class="olist" id="ulist">输入后搜索</div>
        <label>添加：电报ID</label><input id="atgid" placeholder="数字ID" />
        <label>用户名</label><input id="auname" placeholder="username" />
        <label>姓名</label><input id="aname" placeholder="对外姓名" />
        <label>开通天数</label><input id="adays" type="number" value="365" min="1" max="3650" />
        <div class="btns"><button class="ghost" onclick="document.getElementById('adays').value=15">15天</button><button class="ghost" onclick="document.getElementById('adays').value=90">90天</button><button class="ghost" onclick="document.getElementById('adays').value=365">一年</button></div>
        <div class="btns"><button onclick="addUser()">添加并开通</button></div>
      </div>
      <div class="card">
        <h1>确认订单</h1>
        <div class="olist" id="apend">暂无待确认</div>
        <label>订单号</label><input id="acode" placeholder="VH-XXXXXX" />
        <label>交易哈希（可空）</label><input id="atxid" />
        <div class="btns"><button onclick="confirmOrder()">确认开通</button></div>
      </div>
    </section>
  </div>
  <div class="nav">
    <button class="on" id="n1" onclick="tab('pay')">开通</button>
    <button id="n2" onclick="tab('q')">查询</button>
    <button id="n3" onclick="tab('me')">我的</button>
    <button id="n4" class="hidden" onclick="tab('adm')">管理</button>
  </div>
  <script>
    const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
    const user = (tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
    const initData = tg.initData || '';
    const err = document.getElementById('err'), ok = document.getElementById('ok');
    function show(el, msg){ err.style.display='none'; ok.style.display='none'; el.style.display='block'; el.textContent=msg; }
    function tab(name){
      ['pay','q','me','adm'].forEach(n=>document.getElementById('tab-'+n).classList.toggle('hidden', n!==name));
      document.getElementById('n1').classList.toggle('on', name==='pay');
      document.getElementById('n2').classList.toggle('on', name==='q');
      document.getElementById('n3').classList.toggle('on', name==='me');
      document.getElementById('n4').classList.toggle('on', name==='adm');
      if(name==='me'){ loadMe(); loadOrders(); }
      if(name==='adm') loadAdmin();
    }
    if(user){
      document.getElementById('uname').textContent = user.first_name + (user.last_name?(' '+user.last_name):'');
      const av=document.getElementById('av');
      if(user.photo_url) av.innerHTML='<img src="'+user.photo_url+'">';
      else av.textContent=(user.first_name||'?').slice(0,1);
    } else document.getElementById('uname').textContent='请从机器人打开';
    async function api(path, body){
      const r = await fetch(path, { method: body?'POST':'GET', headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(Object.assign({init_data:initData,user_id:user&&user.id}, body)):undefined });
      const j = await r.json(); if(!r.ok||j.error) throw new Error(j.error||'请求失败'); return j;
    }
    async function pay(btn, rail){
      if(!user){ show(err,'请从机器人打开'); return; }
      btn.disabled=true;
      try{
        const j = await api('/api/mini/order', {plan:'year', rail:rail});
        if(j.invoice && tg.openInvoice){ tg.openInvoice(j.invoice, st=>{ if(st==='paid'){ show(ok,'支付成功'); loadMe(); } btn.disabled=false; }); }
        else if(j.address){
          document.getElementById('checkout').classList.remove('hidden');
          document.getElementById('oid').textContent=j.code;
          document.getElementById('oamt').textContent=j.amount+' USDT';
          document.getElementById('ochain').textContent=(j.chain||'TRC20').toUpperCase();
          document.getElementById('oaddr').textContent=j.address;
          window._addr=j.address;
          show(ok,'请复制地址按金额转账');
          btn.disabled=false;
        }
      }catch(e){ show(err,e.message); btn.disabled=false; }
    }
    function copyAddr(){ if(window._addr) navigator.clipboard.writeText(window._addr).then(()=>show(ok,'地址已复制')); }
    async function cancelPay(){
      try{
        await api('/api/mini/cancel', {code: document.getElementById('oid').textContent});
        document.getElementById('checkout').classList.add('hidden');
        show(ok,'订单已取消，可重新支付');
      }catch(e){ show(err,e.message); }
    }
    async function lookup(){
      const q=document.getElementById('q').value.trim();
      try{
        const j=await fetch('/api/mini/lookup?q='+encodeURIComponent(q)).then(r=>r.json());
        const box=document.getElementById('qcard');
        if(j.error){ show(err,j.error); return; }
        box.classList.remove('hidden');
        document.getElementById('qtext').textContent = j.found ? j.card : ('@'+(j.query||q)+' 暂无官方登记');
      }catch(e){ show(err,e.message); }
    }
    async function loadMe(){
      if(!user) return;
      try{
        const j=await fetch('/api/mini/me?user_id='+user.id+'&init_data='+encodeURIComponent(initData)).then(r=>r.json());
        document.getElementById('status').textContent=j.paid?'已开通':'未开通';
        document.getElementById('plan').textContent=j.plan_label||'—';
        document.getElementById('until').textContent=j.paid_until||'—';
        document.getElementById('display').value=j.display_name||'';
        document.getElementById('card').value=j.card_text||'';
        document.getElementById('needpay').textContent=j.paid?'':'充值后才能保存资料';
        if(j.is_admin) document.getElementById('n4').classList.remove('hidden');
      }catch(e){ show(err,e.message); }
    }
    async function loadOrders(){
      if(!user) return;
      try{
        const j=await fetch('/api/mini/orders?user_id='+user.id+'&init_data='+encodeURIComponent(initData)).then(r=>r.json());
        const el=document.getElementById('olist');
        if(!j.orders||!j.orders.length){ el.textContent='暂无'; return; }
        el.innerHTML=j.orders.map(o=>'<div>'+o.created+' · '+o.rail+' · '+o.amount+' · '+o.status+(o.txid?(' · '+o.txid.slice(0,10)):'')+'</div>').join('');
      }catch(e){}
    }
    async function searchUsers(){
      const q=document.getElementById('uq').value.trim();
      try{
        const j=await fetch('/api/mini/admin/users?q='+encodeURIComponent(q)+'&user_id='+(user&&user.id||'')+'&init_data='+encodeURIComponent(initData)).then(r=>r.json());
        if(j.error){ show(err,j.error); return; }
        const el=document.getElementById('ulist');
        if(!j.users||!j.users.length){ el.textContent='未找到'; return; }
        el.innerHTML=j.users.map(u=>'<div>@'+(u.username||'-')+' · '+(u.display_name||'')+' · '+u.tg_id+' · '+u.status+' · '+(u.paid_until||'')+'<br><button class="ghost" style="margin-top:6px" onclick="userAct(\'user_block\','+u.tg_id+')">拉黑</button> <button class="ghost" onclick="userAct(\'user_unblock\','+u.tg_id+')">解除</button> <button class="ghost" onclick="userAct(\'user_delete\','+u.tg_id+')">删除</button></div>').join('');
      }catch(e){ show(err,e.message); }
    }
    async function addUser(){
      try{
        await api('/api/mini/admin',{action:'user_add',tg_id:document.getElementById('atgid').value,username:document.getElementById('auname').value,display_name:document.getElementById('aname').value,days:document.getElementById('adays').value});
        show(ok,'已开通 '+document.getElementById('adays').value+' 天'); searchUsers();
      }catch(e){ show(err,e.message); }
    }
    async function userAct(action,tg_id){
      try{ await api('/api/mini/admin',{action:action,tg_id:tg_id}); show(ok,'已处理'); searchUsers(); }
      catch(e){ show(err,e.message); }
    }
    async function loadAdmin(){
      try{
        const j=await fetch('/api/mini/admin?user_id='+(user&&user.id||'')+'&init_data='+encodeURIComponent(initData)).then(r=>r.json());
        if(j.error){ show(err,j.error); return; }
        document.getElementById('aboard').textContent=j.board||'';
        document.getElementById('astars').value=j.stars||'';
        document.getElementById('ausdt').value=j.usdt||'';
        document.getElementById('aaddr').value=j.address||'';
        document.getElementById('aclone').textContent=j.clone?'克隆：开':'克隆：关';
        document.getElementById('achannel').value=j.force_channel||'';
        window._ch=j.force_channel_on==='1';
        document.getElementById('achon').textContent=window._ch?'强制订阅：开':'强制订阅：关';
        const el=document.getElementById('apend');
        el.innerHTML=(j.pending||[]).length?j.pending.map(o=>'<div onclick="document.getElementById(\'acode\').value=\''+o.code+'\'">'+o.code+' · '+o.amount+'U · '+o.status+'</div>').join(''):'暂无待确认';
      }catch(e){ show(err,e.message); }
    }
    async function setPrice(rail){
      const amount = rail==='stars'?document.getElementById('astars').value:document.getElementById('ausdt').value;
      try{ await api('/api/mini/admin',{action:'price',rail:rail,amount:amount}); show(ok,'价格已更新'); loadAdmin(); }
      catch(e){ show(err,e.message); }
    }
    async function setAddr(){
      try{ await api('/api/mini/admin',{action:'addr',address:document.getElementById('aaddr').value}); show(ok,'地址已更新'); }
      catch(e){ show(err,e.message); }
    }
    async function saveChannel(){
      try{
        const j=await api('/api/mini/admin',{action:'channel',channel:document.getElementById('achannel').value});
        document.getElementById('achannel').value=j.force_channel||'';
        show(ok,'频道已保存');
      }catch(e){ show(err,e.message); }
    }
    async function toggleChannel(){
      try{
        const j=await api('/api/mini/admin',{action:'channel_toggle'});
        window._ch=j.force_channel_on==='1';
        document.getElementById('achon').textContent=window._ch?'强制订阅：开':'强制订阅：关';
        show(ok,window._ch?'强制订阅已开':'强制订阅已关');
      }catch(e){ show(err,e.message); }
    }
    async function toggleClone(){
      try{ const j=await api('/api/mini/admin',{action:'clone'}); show(ok,j.clone?'克隆已开':'克隆已关'); loadAdmin(); }
      catch(e){ show(err,e.message); }
    }
    async function confirmOrder(){
      try{ await api('/api/mini/admin',{action:'confirm',code:document.getElementById('acode').value,txid:document.getElementById('atxid').value}); show(ok,'订单已开通'); loadAdmin(); }
      catch(e){ show(err,e.message); }
    }
    async function save(){
      try{ await api('/api/mini/profile', {display_name:document.getElementById('display').value, card_text:document.getElementById('card').value}); show(ok,'资料已保存'); loadMe(); }
      catch(e){ show(err,e.message); }
    }
    loadMe();
  </script>
</body>
</html>
